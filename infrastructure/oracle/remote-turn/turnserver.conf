# Immutable Remote-owned configuration; secret merged from a protected file.
listening-ip=0.0.0.0
listening-port=3479
min-port=49201
max-port=49240
realm=remote.builtbysai.com
server-name=remote.builtbysai.com
use-auth-secret
fingerprint
no-cli
no-multicast-peers
no-tcp-relay
# This release advertises turn: UDP/TCP, not turns: TLS/DTLS.
no-tls
no-dtls
stale-nonce=600
relay-threads=1
log-file=stdout
simple-log

# Baseline copied from View's reviewed configuration.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Bounded private-alpha capacity; View's own host budget still needs agreement.
user-quota=4
total-quota=20
max-bps=4000000
bps-capacity=16000000
