name: One-time handoff document formatting
on:
  push:
    branches:
      - handoff/format-claude-docs
permissions:
  contents: write
jobs:
  format-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - name: Format handoff documentation
        run: pnpm exec prettier --write CLAUDE.md docs/CLAUDE_HANDOFF.md docs/roadmap.md README.md
      - name: Commit formatted documentation on this branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CLAUDE.md docs/CLAUDE_HANDOFF.md docs/roadmap.md README.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: apply Prettier to Claude handoff"
            git push origin HEAD:handoff/format-claude-docs
          fi
