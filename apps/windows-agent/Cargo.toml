[package]
name = "beacon-remote-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Deliberate acceptance/release build; never enables local owner permission.
signin-media = []

[dependencies]
beacon-remote-core = { path = "../../crates/remote-core" }
serde.workspace = true
serde_json.workspace = true
base64 = "0.23"
ed25519-dalek = { version = "3", features = ["rand_core"] }
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
sha2 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
beacon-remote-session = { path = "../windows-session" }
webrtc = "=0.21.1"
rtc = "=0.21.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
async-trait = "0.1"
bytes = "1"
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
windows = { version = "=0.62.2", features = ["Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi"] }
windows-service = "0.8.1"
windows-sys = { version = "0.61", features = ["Win32_System_WindowsProgramming", "Win32_System_StationsAndDesktops", "Win32_System_Services", "Win32_System_IO", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_Storage_Xps", "Win32_Security", "Win32_Security_Authorization", "Win32_System_RemoteDesktop", "Win32_System_Com", "Win32_UI_Shell_Common", "Win32_System_SystemInformation", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Power", "Win32_System_DataExchange", "Win32_System_Shutdown", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_SystemServices", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_System_Registry", "Win32_Graphics_GdiPlus", "Win32_Graphics_Dwm", "Win32_UI_Accessibility", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_NetworkManagement_Ndis"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
