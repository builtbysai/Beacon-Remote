[package]
name = "beacon-remote-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
beacon-remote-core = { path = "../../crates/remote-core" }
serde.workspace = true
serde_json.workspace = true
base64 = "0.23"
ed25519-dalek = { version = "3", features = ["rand_core"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_System_Memory", "Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_SystemServices", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_System_Registry", "Win32_Graphics_GdiPlus", "Win32_Graphics_Dwm", "Win32_UI_Accessibility"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
