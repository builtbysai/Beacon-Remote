[package]
name = "beacon-remote-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
beacon-remote-core = { path = "../../crates/remote-core" }
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_System_Memory", "Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }
